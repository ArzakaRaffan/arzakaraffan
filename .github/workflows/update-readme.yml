name: Update README stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6h; refreshes the WakaTime stats block
  workflow_dispatch:

permissions:
  contents: write

jobs:
  waka-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_TIME_RANGE: True
          SHOW_LANGUAGE: True
          SHOW_OS: True
          SHOW_TOTAL_CODE_TIME: True
          BLOCKS: "▓▓▓░░░"

# The contribution activity graph is rendered live by
# github-readme-activity-graph.vercel.app straight from the README — no job needed.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   WAKATIME_API_KEY - from wakatime.com/settings/api-key
#   GH_TOKEN         - a PAT with `repo` scope (waka-readme-stats needs write access
#                       beyond the default GITHUB_TOKEN to edit README.md via commit)
