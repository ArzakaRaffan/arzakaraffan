name: Update README stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6h; WakaTime stats block + contribution snake
  workflow_dispatch:

permissions:
  contents: write

jobs:
  waka-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_TIME_RANGE: True
          SHOW_LANGUAGE: True
          SHOW_OS: True
          SHOW_TOTAL_CODE_TIME: True
          BLOCKS: "▓▓▓░░░"

  snake-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Required repo secrets (Settings > Secrets and variables > Actions):
#   WAKATIME_API_KEY - from wakatime.com/settings/api-key
#   GH_TOKEN         - a PAT with `repo` scope (waka-readme-stats needs write access
#                       beyond the default GITHUB_TOKEN to edit README.md via commit)
# The snake job uses the built-in GITHUB_TOKEN, no setup needed. It generates the
# SVGs entirely in Actions and pushes them to the `output` branch, so there is no
# third-party image host that can go down.
